        const mainCrab = document.getElementById("mainCrab");
        const footer = document.querySelector("footer");

        mainCrab.addEventListener("click", function () {
            spawnCrab();
        });

        function spawnCrab() {
            const newCrab = mainCrab.cloneNode(true);

            newCrab.removeAttribute("id");
            newCrab.classList.add("spawned-crab");

            footer.appendChild(newCrab);

            newCrab.addEventListener("animationend", function (event) {
                if (event.animationName === "spawnedCrabWalk") {
                    newCrab.remove();
                }
            });
        }
